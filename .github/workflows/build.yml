name: Automaattinen ESP32 Build

on:
  workflow_dispatch: # Mahdollistaa käynnistyksen napista selaimessa
  release:
    types: [published] # Käynnistyy automaattisesti kun teet julkaisun

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hae koodi
        uses: actions/checkout@v4

      - name: Asenna Node.js (Web-käyttöliittymää varten)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Asenna pnpm ja rakenna Frontend
        run: |
          npm install -g pnpm
          cd frontend
          pnpm install
          pnpm build
          cd ..

      - name: Asenna Python ja PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install platformio

      - name: Korjaa deep+ bugi lennosta
        run: sed -i 's/lib_ldf_mode = deep+/lib_ldf_mode = chain/g' platformio.ini

      - name: Käännä firmware (.bin tiedostoksi)
        run: platformio run -e esp32dev

      - name: Tallenna valmis tiedosto ladattavaksi
        uses: actions/upload-artifact@v4
        with:
          name: ikea-led-firmware
          path: .pio/build/esp32dev/firmware.bin
