name: Automaattinen ESP32 Build

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # Päivitetty v4 -> v4.2.2 (tukee Node 24:ää virallisesti)
      - name: Hae koodi
        uses: actions/checkout@v4.2.2

      # Päivitetty v4 -> v4.2.0 (Nykyaikainen Node-alustus)
      - name: Asenna Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 24

      # Päivitetty v5 -> v5.3.0 (Nykyaikainen Python-alustus)
      - name: Asenna Python ja vaaditut paketit
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
      
      - name: Valmistele ympäristö
        run: |
          pip install platformio poetry requests requests_toolbelt tqdm

      - name: Asenna pnpm ja rakenna Frontend
        run: |
          npm install -g pnpm
          cd frontend
          pnpm install
          pnpm build
          cd ..

      - name: Korjaa deep+ bugi lennosta
        run: sed -i 's/lib_ldf_mode = deep+/lib_ldf_mode = chain/g' platformio.ini

      - name: Käännä firmware (.bin tiedostoksi)
        run: platformio run -e esp32dev

      - name: Tallenna valmis tiedosto ladattavaksi
        uses: actions/upload-artifact@v4
        with:
          name: ikea-led-firmware
          path: .pio/build/esp32dev/firmware.bin
