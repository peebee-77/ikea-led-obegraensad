name: Automaattinen ESP32 Build

on:
  workflow_dispatch: # Käynnistys napista selaimessa
  release:
    types: [published]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true # Hiljentää Node-varoitukset

jobs:
  build:
    runs-on: ubuntu-24.04 # Lukitaan vakaaseen versioon, joka toimii varmasti

    steps:
      - name: Hae koodi
        uses: actions/checkout@v4

      - name: Asenna Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Asenna Python ja vaaditut paketit
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      # Asennetaan PlatformIO sekä esittämäsi projektin Python-riippuvuudet (kuten poetry/requests)
      - name: Valmistele ympäristö
        run: |
          pip install platformio poetry requests requests_toolbelt tqdm

      - name: Asenna pnpm ja rakenna Frontend
        run: |
          npm install -g pnpm
          cd frontend
          pnpm install
          pnpm build
          cd ..

      - name: Korjaa deep+ bugi lennosta
        run: sed -i 's/lib_ldf_mode = deep+/lib_ldf_mode = chain/g' platformio.ini

      - name: Käännä firmware (.bin tiedostoksi)
        run: platformio run -e esp32dev

      - name: Tallenna valmis tiedosto ladattavaksi
        uses: actions/upload-artifact@v4
        with:
          name: ikea-led-firmware
          path: .pio/build/esp32dev/firmware.bin
